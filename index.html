<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تایبەت بۆ نازە خاتوون ❤️</title>
    <style>
        :root { --main-color: #ff3366; --bg-color: #0f0f0f; }
        body { 
            margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; 
            background: radial-gradient(circle, #2d1b2e 0%, #0f0f0f 100%); 
            font-family: 'Tahoma', sans-serif; overflow: hidden; color: white;
        }
        .card { 
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px);
            padding: 40px; border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center; width: 320px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            transition: 0.5s;
        }
        h1 { color: #ff8da1; margin-bottom: 20px; }
        .btn { 
            background: var(--main-color); color: white; border: none; padding: 15px 30px;
            border-radius: 50px; font-size: 1.1rem; cursor: pointer; font-weight: bold;
            box-shadow: 0 5px 15px rgba(255, 51, 102, 0.4);
        }
        .heart-rain { position: absolute; color: var(--main-color); font-size: 1.5rem; top: -50px; animation: rain linear infinite; }
        @keyframes rain { to { transform: translateY(100vh); } }
        .hidden { display: none; }
        #yesBtn { background: #4caf50; }
        #noBtn { position: absolute; background: #f44336; }
    </style>
</head>
<body>

<div class="card" id="qBox">
    <h1>ئاریانەوە بۆ نازە خاتوون ❤️</h1>
    <p>ئایا خۆشت دەوێم؟</p>
    <button class="btn" id="yesBtn" onclick="next()">بەڵێ</button>
    <button class="btn" id="noBtn" onmouseover="run(this)">نەخێر</button>
</div>

<div class="card hidden" id="giftBox">
    <h1 id="msg">خۆشم دەوێیت نازە گیانم! ❤️</h1>
    <button class="btn" onclick="showSurprise()">بینینی دیارییەکان</button>
</div>

<script>
    function run(btn) {
        btn.style.left = Math.random() * (window.innerWidth - 100) + "px";
        btn.style.top = Math.random() * (window.innerHeight - 100) + "px";
    }
    function next() {
        document.getElementById('qBox').classList.add('hidden');
        document.getElementById('giftBox').classList.remove('hidden');
    }
    function showSurprise() {
        alert("١. یادگارییەکانمان\n٢. گۆرانییەک بۆ تۆ\n٣. نامەیەکی پڕ لە خۆشەویستی");
        setInterval(() => {
            const h = document.createElement('div');
            h.innerHTML = "❤️";
            h.className = 'heart-rain';
            h.style.left = Math.random() * 100 + "vw";
            h.style.animationDuration = Math.random() * 3 + 2 + "s";
            document.body.appendChild(h);
            setTimeout(() => h.remove(), 5000);
        }, 200);
    }
</script>

</body>
</html>
